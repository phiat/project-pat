<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{.Title}} · project-pat</title>
<script>
// Apply theme before the stylesheet loads to avoid a flash-of-wrong-theme.
(function () {
  try {
    var t = localStorage.getItem("pat-theme");
    if (!t) t = window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
    if (t === "light") document.documentElement.setAttribute("data-theme", "light");
  } catch (_) {}
})();
</script>
<link rel="stylesheet" href="/static/css/app.css">
<script src="https://unpkg.com/htmx.org@2.0.4" defer></script>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.169.0/build/three.module.js" } }
</script>
<script type="module" src="/static/js/background.js" defer></script>
<script src="/static/js/stream.js" defer></script>
<script src="/static/js/copy.js" defer></script>
<script src="/static/js/forms.js" defer></script>
<script src="/static/js/theme.js" defer></script>
</head>
<body>
<canvas id="bg-canvas"></canvas>
<div class="scrim"></div>

<header class="topbar">
  <a href="/" class="brand">
    <span class="brand-mark">▣</span>
    <span class="brand-name">project-pat</span>
  </a>
  <nav class="nav">
    <a href="/">overview</a>
    <a href="/ideas">ideas</a>
    <a href="/projects">projects</a>
    <a href="/floor">floor</a>
    <a href="/board">board</a>
    <a href="/agents">agents</a>
    <a href="/inbox">inbox{{if .UnreadInbox}} <span class="nav-badge">{{.UnreadInbox}}</span>{{end}}</a>
    <a href="/runs">runs</a>
  </nav>
  <div class="topbar-right">
    <button type="button" class="theme-toggle" aria-label="toggle theme" title="toggle theme">
      <svg class="theme-icon theme-icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="4"></circle>
        <line x1="12" y1="2" x2="12" y2="4"></line>
        <line x1="12" y1="20" x2="12" y2="22"></line>
        <line x1="4.93" y1="4.93" x2="6.34" y2="6.34"></line>
        <line x1="17.66" y1="17.66" x2="19.07" y2="19.07"></line>
        <line x1="2" y1="12" x2="4" y2="12"></line>
        <line x1="20" y1="12" x2="22" y2="12"></line>
        <line x1="4.93" y1="19.07" x2="6.34" y2="17.66"></line>
        <line x1="17.66" y1="6.34" x2="19.07" y2="4.93"></line>
      </svg>
      <svg class="theme-icon theme-icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
      </svg>
    </button>
  </div>
</header>

<main class="page">
  {{template "content" .}}
</main>

<footer class="footer">
  <span>flash · pro · sqlite · htmx</span>
  <span class="muted">single-user · localhost</span>
</footer>
</body>
</html>
