{{define "cron_picker"}}
<div class="cron-control">
  <select class="cron-preset" data-target="{{.TargetID}}">
    <option value="">— preset —</option>
    <option value="@every 5m">every 5m</option>
    <option value="@every 15m">every 15m</option>
    <option value="@every 30m">every 30m</option>
    <option value="@every 1h">every 1h</option>
    <option value="@every 3h">every 3h</option>
    <option value="@every 6h">every 6h</option>
    <option value="@every 12h">every 12h</option>
    <option value="0 8 * * *">daily 08:00</option>
    <option value="0 8 * * 1">weekly Mon 08:00</option>
    <option value="@weekly">@weekly (Sun 00:00)</option>
  </select>
  <input id="{{.TargetID}}" type="text" name="cron" placeholder="cron e.g. '0 8 * * *' or '@every 1h'" value="{{.Value}}">
</div>
{{end}}
